<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VShare</title>
  <meta name="description" content="VShare — tìm học liệu có căn cứ trong kho tài liệu cộng đồng.">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="/assets/logo-cat.jpg">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <link rel="stylesheet" href="/styles/components.css">
</head>
<body>
  <!--
    Application shell only. Every screen is rendered by a view module into
    [data-outlet]; markup lives next to the behaviour that owns it.
  -->
  <div class="app">
    <!-- Mobile-only bar; the sidebar becomes a drawer below 900px. -->
    <div class="topbar">
      <button type="button" class="topbar__menu" data-sidebar-toggle aria-label="Mở điều hướng"></button>
      <a class="topbar__brand" href="#/feed">
        <img class="brand__mark" src="/assets/logo-cat.jpg" alt="">
        <span>VShare</span>
      </a>
    </div>

    <div class="sidebar__scrim" data-sidebar-scrim hidden></div>

    <aside class="sidebar" data-sidebar>
      <a class="brand" href="#/feed">
        <img class="brand__mark" src="/assets/logo-cat.jpg" alt="">
        <span class="brand__text">
          <strong class="brand__name">VShare</strong>
          <small class="brand__tagline">Kho học liệu cộng đồng</small>
        </span>
      </a>

      <nav class="nav" data-nav aria-label="Điều hướng chính"></nav>

      <div class="sidebar__foot" data-account></div>
    </aside>

    <main class="main" data-outlet>
      <div class="boot">
        <span class="spinner"></span>
        <p>Đang khởi động…</p>
      </div>
    </main>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
